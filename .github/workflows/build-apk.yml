name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir www
                    cp "$(ls -S *.html | head -1)" www/index.html
          cp sw.js manifest.webmanifest *.png www/
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Viola com.hamoudy.viola --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Set app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            convert icon-512.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
            rm -f $R/mipmap-$d/ic_launcher_foreground.png
          done
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Viola.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Viola-apk
          path: Viola.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Viola APK
          files: Viola.apk
          make_latest: true
