<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Viola</title><meta name="theme-color" content="#0A0610"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0610;--s1:#140C21;--s2:#1E1331;--line:#2F1F4B;--velvet:#4C1D95;--am:#A855F7;--am2:#C084FC;--silver:#CFC9DC;--cream:#FFFFFF;--fg:#FFFFFF;--mut:#9A8DB4;--ok:#6EE7B7;--grad:linear-gradient(135deg,#C084FC,#7C3AED 55%,#4C1D95);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 'Readex Pro',Tahoma,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}input{font:inherit;color:inherit}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.stage{height:100%;display:flex;justify-content:center;background:radial-gradient(60% 40% at 50% 0,#2a1050 0,transparent 70%),var(--bg)}
.app{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media(min-width:560px){.stage{align-items:center;background:#050309}.app{height:min(100%,860px);border-radius:30px;border:1px solid var(--line);box-shadow:0 30px 80px #000}}
.hdr{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo{width:42px;height:42px;border-radius:13px;background:radial-gradient(circle at 50% 0,#3b1a6e,#120A20);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 0 18px #7c3aed55}
.logo svg{width:30px;height:30px}
.word{font:700 22px/1 'Readex Pro';letter-spacing:.01em;color:var(--cream)}.word small{display:block;font:400 10px/1 'Readex Pro';color:var(--mut);margin-top:5px;letter-spacing:.04em}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);position:relative}
.ib i{position:absolute;top:9px;inset-inline-end:10px;width:8px;height:8px;border-radius:50%;background:var(--am);border:2px solid var(--s1)}
.scr{flex:1;min-height:0;overflow-y:auto;display:none;padding:4px 16px 24px}.scr.on{display:block}
.pt{font:700 24px/1.2 'Readex Pro';margin:8px 0 2px;color:var(--cream)}.sub{color:var(--mut);font-size:12px}.grow{flex:1;min-width:0}
.search{display:flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:4px 14px 4px 4px;margin:6px 0 12px}
.search:focus-within{border-color:var(--am)}.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:10px 6px}.search input::placeholder{color:var(--mut)}
.go{background:var(--grad);color:#fff;border-radius:16px;padding:9px 14px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 16px;border-radius:12px;background:var(--s2);color:var(--silver);white-space:nowrap;font-size:13px}.chip.on{background:var(--cream);color:#1a0b2e;font-weight:600}
.vc{margin-bottom:20px}.tw{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/9;background:var(--s2);cursor:pointer;border:1px solid var(--line)}
.tw svg.th{width:100%;height:100%;display:block}
.dur{position:absolute;bottom:8px;inset-inline-start:8px;background:#000c;padding:1px 7px;border-radius:7px;font-size:11px;font-weight:500;direction:ltr}
.pbtn{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:#0009;display:grid;place-items:center;border:1px solid #ffffff44;backdrop-filter:blur(4px)}
.vm{display:flex;gap:10px;align-items:flex-start;padding:10px 2px 0}.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:#fff}
.tt{font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dl{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--am2);flex:none}.dl.done{color:var(--ok)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px}.row{display:flex;align-items:center;gap:12px}
.qi{display:flex;gap:12px;align-items:center;padding:10px;background:var(--s1);border:1px solid var(--line);border-radius:18px;margin-bottom:10px}
.qi .tw{width:92px;aspect-ratio:16/10;border-radius:12px;flex:none}.bar{height:5px;background:var(--s2);border-radius:5px;overflow:hidden;margin:7px 0 3px}.bar b{display:block;height:100%;background:var(--grad);border-radius:5px}
.sb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--s2);flex:none}
.h2{font:600 16px 'Readex Pro';margin:16px 0 10px;color:var(--silver)}
.tr{display:flex;gap:12px;align-items:center;padding:8px;border-radius:16px;cursor:pointer}.tr.cur{background:var(--s2)}.art{width:52px;height:52px;border-radius:14px;overflow:hidden;flex:none}.art svg{width:100%;height:100%;display:block}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}.eq i{width:3px;background:var(--am2);border-radius:2px;animation:eq .9s infinite ease-in-out}.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.set{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}.set:last-child{border:0}.set .ic{color:var(--am2)}
.sw{width:44px;height:26px;border-radius:14px;background:var(--s2);border:1px solid var(--line);position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:.2s}.sw.on{background:var(--velvet);border-color:var(--am)}.sw.on::after{inset-inline-start:21px;background:var(--cream)}
.val{color:var(--am2);font-weight:500;font-size:13px}
.mini{display:flex;align-items:center;gap:10px;margin:0 12px 8px;padding:8px 10px;background:#1E1331ee;border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(10px)}.mini .art{width:42px;height:42px;border-radius:11px}
.nav{display:flex;border-top:1px solid var(--line);background:#0A0610;padding:6px 6px 4px}.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mut);font-size:11px;position:relative}
.nav button.on{color:var(--cream)}.nav button.on .ic{color:var(--am2)}.nav button.on::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:3px;background:var(--grad)}
.bdg{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);background:var(--am);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center}
.lay{position:absolute;inset:0;display:none;align-items:flex-end;z-index:20}.lay.on{display:flex}.scrim{position:absolute;inset:0;background:#000a}
.sheet{position:relative;width:100%;max-height:88%;overflow-y:auto;background:var(--s1);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:10px 18px 22px;animation:up .25s ease}@keyframes up{from{transform:translateY(30px);opacity:0}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;margin-top:8px}.opt.on{border-color:var(--am);background:#2a1450}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);flex:none}.opt.on .rd{border:6px solid var(--am2)}
.big{width:100%;margin-top:14px;padding:14px;border-radius:18px;background:var(--grad);font-weight:700;text-align:center;display:flex;justify-content:center;gap:8px}
input[type=range]{width:100%;accent-color:var(--am2)}
.toast{position:absolute;bottom:90px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--cream);color:#1a0b2e;padding:9px 16px;border-radius:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:30px 0}

.lay{z-index:50}.nav,.mini,.sheet{background:rgba(20,12,33,.58);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%)}
.toast{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;background:#000;color:#fff;border-radius:24px;padding:11px 20px;transform:translateY(-16px) scale(.6);z-index:60;border:1px solid #ffffff22}.toast.on{transform:none}
#dr{position:absolute;inset:0;z-index:45;display:none}#dr.on{display:block}#dr .scrim{position:absolute;inset:0;background:#000a}
#dr aside{position:absolute;top:0;bottom:0;inset-inline-start:0;width:78%;max-width:320px;background:var(--s1);border-inline-end:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 14px 14px;display:flex;flex-direction:column;overflow:auto;animation:up .25s}
#pv{position:absolute;inset:0;z-index:40;background:#000;display:none;flex-direction:column;overflow:auto}#pv.on{display:flex}
.pvh{display:flex;gap:10px;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px}
.pvc{display:flex;gap:8px;flex-wrap:wrap;padding:14px}.pvc select,.pvc button{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:9px 12px;color:var(--fg);font:inherit;display:flex;gap:6px;align-items:center}
.wgg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wgt{border-radius:26px;padding:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);display:flex;flex-direction:column;justify-content:space-between;min-height:150px}.wgt.m{grid-column:span 2;min-height:110px}.wb{font:300 44px/1 'Readex Pro';color:var(--cream)}
</style></head><body>
